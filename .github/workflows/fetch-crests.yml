name: Récupérer les logos des clubs

on:
  workflow_dispatch: {}   # se lance manuellement depuis l'onglet "Actions"
  schedule:
    - cron: '0 4 1 * *'   # une fois par mois, pour rattraper les nouveaux clubs

permissions:
  contents: write

jobs:
  fetch-crests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Chercher et télécharger les logos
        run: node scripts/fetch-crests.mjs

      - name: Publier les logos récupérés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crests/ crests-index.json missing-crests.csv
          git diff --staged --quiet || git commit -m "Mise à jour automatique des logos"
          git push

      - name: Résumé
        run: |
          echo "### Logos manquants" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat missing-crests.csv >> $GITHUB_STEP_SUMMARY
