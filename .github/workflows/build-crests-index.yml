name: Reconstruire l'index des logos des clubs

on:
  workflow_dispatch: {}   # se lance manuellement depuis l'onglet "Actions"
  push:
    paths:
      - 'crests/**'       # se déclenche dès que tu ajoutes/retires un logo
      - 'competition-logos/**'
      - 'index.html'       # ou que la liste des clubs change

permissions:
  contents: write

jobs:
  build-crests-index:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Nettoyer les fichiers SVG (BOM, caractères parasites)
        run: node scripts/clean-svgs.mjs

      - name: Reconstruire crests-index.json depuis crests/
        run: node scripts/build-crests-index.mjs

      - name: Publier si des changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crests/ competition-logos/ crests-index.json missing-crests.csv
          git diff --staged --quiet || git commit -m "Nettoyage des SVG et reconstruction de l'index des logos"
          git push

      - name: Résumé
        run: |
          echo "### Logos manquants" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat missing-crests.csv >> $GITHUB_STEP_SUMMARY
