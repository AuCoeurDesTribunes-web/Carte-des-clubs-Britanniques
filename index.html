<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>Au Cœur Des Tribunes — Carte des clubs UK & Irlande</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #050505;
    --panel: #0c0c0c;
    --panel-2: #171717;
    --line: #2c2c2c;
    --text: #ffffff;
    --text-dim: #9a9a9a;
    --accent: #ffffff;
    --accent-text: #000000;

    --c-pl: #ffffff;
    --c-champ: #d9d9d9;
    --c-l1: #b8b8b8;
    --c-l2: #969696;
    --c-nl: #737373;
    --c-irl: #e6e6e6;
    --c-ni: #c2c2c2;
    --c-scotp: #a0a0a0;
    --c-scotc: #7d7d7d;
    --c-wal: #4a4a4a;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; touch-action: manipulation; }
  body{
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  #app { display: flex; height: 100vh; width: 100vw; }

  /* ---------- SIDEBAR ---------- */
  #sidebar{
    width: 320px;
    min-width: 320px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    z-index: 10;
    transition: margin-left .25s ease;
  }
  #sidebar.collapsed{ margin-left: -320px; }

  .brand{
    padding: 20px 18px 14px 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(160deg, rgba(255,255,255,.06), transparent 70%);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-logo{
    width: 44px;
    height: 44px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .brand-text{ min-width: 0; }
  .brand h1{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 2px 0;
    letter-spacing: .2px;
    line-height: 1.2;
  }
  .brand h1 span{ color: var(--accent); }
  .brand p{
    margin: 0;
    font-size: 12px;
    color: var(--text-dim);
  }

  .search-wrap{
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  .search-box{
    position: relative;
  }
  .search-box input{
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 10px 34px 10px 12px;
    color: var(--text);
    font-size: 13.5px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s;
  }
  .search-box input:focus{ border-color: var(--accent); }
  .search-box svg{
    position: absolute;
    right: 11px; top: 50%;
    transform: translateY(-50%);
    width: 15px; height: 15px;
    stroke: var(--text-dim);
  }
  #search-results{
    margin-top: 8px;
    max-height: 180px;
    overflow-y: auto;
    display: none;
  }
  #search-results.show{ display: block; }
  .search-result{
    padding: 7px 10px;
    font-size: 12.5px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
  }
  .search-result:hover{ background: var(--panel-2); }
  .search-result .dot{ width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .search-result .league{ color: var(--text-dim); font-size: 11px; margin-left: auto; }

  .toolbar{
    display: flex;
    gap: 8px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
  }
  .toolbar button{
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 500;
    padding: 7px 6px;
    border-radius: 7px;
    cursor: pointer;
    transition: all .15s;
  }
  .toolbar button:hover{ border-color: var(--accent); color: var(--text); }

  #leagues{
    flex: 1;
    overflow-y: auto;
    padding: 6px 10px 16px 10px;
  }
  .country-group{ margin-top: 10px; }
  .country-title{
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--text-dim);
    padding: 6px 8px 4px 8px;
    font-weight: 600;
  }
  .league-row{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    margin-bottom: 6px;
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
    background: #ffffff;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .league-row:hover{ transform: translateY(-1px); box-shadow: 0 2px 7px rgba(0,0,0,.4); }
  .league-row .league-logo{
    width: 22px; height: 22px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .league-row .lname{
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    color: #111111;
  }
  .league-row .lcount{
    font-size: 11px;
    color: #555555;
    background: #eeeeee;
    padding: 1px 7px;
    border-radius: 10px;
  }
  .league-row.off{ opacity: .4; }
  .league-row.off .lname{ text-decoration: line-through; }

  .sidebar-footer{
    padding: 12px 18px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .sidebar-footer-row{ display: flex; justify-content: space-between; }
  .sidebar-footer-updated{ font-size: 10px; opacity: .75; }

  /* ---------- MAP ---------- */
  #map-wrap{ flex: 1; position: relative; }
  #map{ height: 100%; width: 100%; background: var(--bg); }

  #toggle-sidebar{
    position: absolute;
    top: 14px; left: 14px;
    z-index: 1001;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    width: 38px; height: 38px;
    border-radius: 9px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
  }
  #toggle-sidebar svg{ width: 18px; height: 18px; stroke: var(--text); }

  .leaflet-popup-content-wrapper{
    background: var(--panel);
    color: var(--text);
    border-radius: 10px;
    border: 1px solid var(--line);
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  .leaflet-popup-tip{ background: var(--panel); border: 1px solid var(--line); }
  .leaflet-popup-content{ margin: 12px 14px; font-family: 'Inter', sans-serif; }
  .leaflet-popup-close-button{ color: var(--text-dim) !important; }

  .popup-crest{
    display: none;
    justify-content: center;
    margin-bottom: 8px;
  }
  .popup-crest img{
    height: 46px;
    max-width: 100%;
    object-fit: contain;
  }
  .popup-league{
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .6px;
    font-weight: 600;
    margin-bottom: 3px;
  }
  .popup-name{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 9px;
    line-height: 1.25;
  }
  .popup-subheading{
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .fixture-month-select{
    width: 100%;
    margin-bottom: 6px;
    padding: 6px 8px;
    font-size: 12.5px;
    font-family: 'Inter', sans-serif;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .popup-fixtures{
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 4px;
    max-height: 180px;
    overflow-y: auto;
  }
  .fixture-row{
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 12.5px;
    padding: 7px 9px;
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .fixture-competition{
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .4px;
    color: #666666;
  }
  .fixture-competition img{
    width: 13px;
    height: 13px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .fixture-main{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .fixture-row .fixture-date{ color: #555555; white-space: nowrap; }
  .fixture-opp{
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .fixture-opp .fixture-vs{ color: #999999; font-size: 11px; }
  .fixture-opp .fixture-opp-crest{
    width: 20px;
    height: 20px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .fixture-opp .fixture-opp-name{
    font-weight: 500;
    color: #111111;
  }
  .popup-fixtures.empty{
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .popup-link{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 11px;
    border-radius: 7px;
    text-decoration: none;
    transition: background .15s;
  }
  .popup-link:hover{ background: var(--accent); }

  .cluster-icon{
    background: var(--panel);
    border: 2px solid var(--accent);
    border-radius: 50%;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px rgba(0,0,0,.5);
  }

  #count-badge{
    position: absolute;
    top: 14px; right: 14px;
    z-index: 999;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 9px;
    font-size: 12.5px;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
  }
  #count-badge b{ color: var(--accent); font-family: 'Space Grotesk', sans-serif; }

  /* ---------- MAP TOP CONTROLS ---------- */
  #map-controls{
    position: absolute;
    top: 14px;
    left: 62px;
    z-index: 999;
    display: flex;
    gap: 8px;
  }
  .segmented{
    display: flex;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 3px;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
  }
  .segmented button{
    display: flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .segmented button svg{ width: 13px; height: 13px; }
  .segmented button:hover{ color: var(--text); }
  .segmented button.active{
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
  }

  /* ---------- MARKER ICONS ---------- */
  .marker-crest-icon{
    width: 34px; height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .marker-crest-icon img{
    width: 100%; height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.85)) drop-shadow(0 0 3px rgba(0,0,0,.6));
  }
  .marker-crest-icon.is-fallback{
    border-radius: 50%;
    background: var(--panel-2);
    border: 2.5px solid;
    box-shadow: 0 3px 10px rgba(0,0,0,.55);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 11px;
    color: var(--text);
  }

  ::-webkit-scrollbar{ width: 6px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 3px; }

  @media (max-width: 720px){
    #sidebar{
      position: absolute;
      height: 100%;
      width: min(86vw, 340px);
      min-width: 0;
      box-shadow: 0 0 30px rgba(0,0,0,.6);
    }
    #sidebar.collapsed{ margin-left: min(-86vw, -340px); }

    #map-controls{
      left: 58px;
      max-width: calc(100vw - 130px);
      flex-wrap: wrap;
    }
    .segmented button{ padding: 7px 8px; font-size: 11px; }

    #count-badge{
      font-size: 11px;
      padding: 7px 9px;
    }

    .leaflet-popup-content-wrapper{ max-width: 78vw; }
    .leaflet-popup-content{ width: auto !important; max-width: 74vw; margin: 12px 12px; }
    .popup-fixtures{ max-height: 40vh; }
  }

  @media (max-width: 420px){
    #map-controls{ top: 62px; left: 14px; }
    .segmented button span.seg-label{ display: none; }
  }
</style>
</head>

/* Petit utilitaire anti-cache : certains réseaux mobiles/CDN ont tendance à
   garder une vieille copie en cache de ces fichiers JSON plus longtemps que
   prévu (déjà observé sur la page principale). On force une requête fraîche
   à chaque chargement en ajoutant un paramètre unique à l'URL. */
function noCacheUrl(url){ return `${url}?_=${Date.now()}`; }

/* ---------------- FIXTURES (calendrier des matchs à domicile) ---------------- */
/* Généré automatiquement 2x/jour par une GitHub Action (voir scripts/update-fixtures.mjs).
   fixtures.json n'existe qu'une fois cette Action exécutée au moins une fois. */
let FIXTURES_DATA = {};
fetch(noCacheUrl('fixtures.json'))
  .then(res => res.ok ? res.json() : null)
  .then(data => {
    if (!data) return;
    FIXTURES_DATA = data.clubs || {};
    const el = document.getElementById('fixtures-updated');
    if (el && data.generated_at){
      const d = new Date(data.generated_at);
      el.textContent = 'Calendrier actualisé le ' + d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) + ' à ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    }
  })
  .catch(() => { /* pas encore généré, ou hors-ligne : les popups retombent sur le lien Flashscore */ });

function formatFixtureDate(iso){
  const d = new Date(iso);
  const day = d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
  const time = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  return `${day} · ${time}`;
}

const map = L.map('map', { zoomControl: false, minZoom: 4 }).setView([54.5, -4.5], 6);

const basemaps = {
  streets: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    subdomains: 'abcd',
    maxZoom: 19
  }),
  satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &mdash; Esri, Maxar, Earthstar Geographics',
    maxZoom: 19
  })
};
basemaps.satellite.addTo(map);
let currentBasemap = 'satellite';

document.querySelectorAll('#basemap-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    const choice = btn.dataset.basemap;
    if (choice === currentBasemap) return;
    map.removeLayer(basemaps[currentBasemap]);
    basemaps[choice].addTo(map);
    currentBasemap = choice;
    document.querySelectorAll('#basemap-toggle button').forEach(b => b.classList.toggle('active', b === btn));
  });
});

L.control.zoom({ position: 'bottomright' }).addTo(map);

/* Cluster groups per league so toggling a league adds/removes its cluster group */
const clusterGroups = {};
const allMarkers = []; // {marker, league, name}

function makeClusterIcon(cluster){
  const count = cluster.getChildCount();
  const size = count < 10 ? 32 : count < 30 ? 38 : 46;
  return L.divIcon({
    html: `<div class="cluster-icon" style="width:${size}px;height:${size}px;font-size:${count<30?12:13}px;">${count}</div>`,
    className: '',
    iconSize: L.point(size, size)
  });
}

/* ---- marker icon rendering : écussons uniquement (le mode "points" a été retiré) ---- */
const STOPWORDS = new Set(['fc','afc','cf','the','and','united','town','city','county','athletic','albion','rovers','wanderers','rangers']);
function initials(name){
  const words = name.replace(/[^a-zA-Z' ]/g, ' ').split(' ').filter(Boolean);
  const significant = words.filter(w => !STOPWORDS.has(w.toLowerCase()));
  const pool = significant.length ? significant : words;
  return pool.slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?';
}

/* Must match the slugify used by fetch-crests.mjs / crests_manifest.csv:
   lowercase, accents stripped, everything that isn't a-z0-9 becomes "-". */
function slugify(name){
  return name
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

/* crests-index.json maps slug -> real filename (with the correct extension:
   fetch-crests.mjs checks the actual downloaded bytes, so a club whose
   crest is a .jpg on its source site stays a .jpg here rather than being
   force-renamed to .png). Loaded once at startup; until it's ready (or for
   any club it doesn't cover) we fall back to guessing "<slug>.png", which
   the onerror handler below turns into the initials icon if wrong. */
let CREST_INDEX = {};
fetch(noCacheUrl('crests-index.json'))
  .then(r => r.ok ? r.json() : {})
  .then(data => {
    CREST_INDEX = data || {};
    allMarkers.forEach(entry => {
      entry.marker.setIcon(crestIcon(entry.name, LEAGUE_META[entry.league].hex));
    });
  })
  .catch(() => { /* crests-index.json pas encore généré — pas grave, fallback actif */ });

function crestPath(name){
  const slug = slugify(name);
  return `crests/${CREST_INDEX[slug] || (slug + '.png')}`;
}

/* Même mécanisme que crests-index.json, mais pour les logos de compétition
   (Premier League, Championship, Ligue des Champions...) que tu déposeras
   toi-même dans le dossier competition-logos/. Le manifeste est optionnel :
   sans lui, on devine "<slug-de-la-compétition>.png". */
let COMPETITION_LOGO_INDEX = {};
fetch(noCacheUrl('competition-logos-index.json'))
  .then(r => r.ok ? r.json() : {})
  .then(data => {
    COMPETITION_LOGO_INDEX = data || {};
    // La légende (sidebar) est construite en synchrone avant que ce fetch
    // ne se termine : elle a donc deviné "<slug>.png" par défaut, ce qui
    // 404 pour tout logo qui est en réalité un .svg. On corrige les <img>
    // déjà dans le DOM avec le vrai chemin une fois le manifeste connu.
    document.querySelectorAll('.league-row').forEach(row => {
      const img = row.querySelector('.league-logo');
      if (!img || !row.dataset.league) return;
      img.style.display = '';
      img.src = competitionLogoPath(slugify(row.dataset.league));
    });
  })
  .catch(() => { /* pas de manifeste : le fallback <slug>.png suffit */ });

function competitionLogoPath(slug){
  return `competition-logos/${COMPETITION_LOGO_INDEX[slug] || (slug + '.png')}`;
}

/* Global helper called from the onerror="" attribute embedded in the raw
   divIcon HTML string below (Leaflet icons are just static markup, so this
   is the simplest way to react to a missing image without wiring up an
   event listener per-marker). When crests/xxx.png 404s (club not yet in the
   manifest), we swap the icon to the initials fallback in place. */
window.__crestFallback = function(imgEl, txt){
  const box = imgEl.closest('.marker-crest-icon');
  if (!box) return;
  box.classList.add('is-fallback');
  box.textContent = txt;
};

function crestIcon(name, hex){
  const txt = initials(name);
  return L.divIcon({
    className: '',
    html: `<div class="marker-crest-icon" style="border-color:${hex}"><img src="${crestPath(name)}" alt="" onerror="window.__crestFallback(this,'${txt}')"></div>`,
    iconSize: [34, 34],
    iconAnchor: [17, 17],
    popupAnchor: [0, -18]
  });
}

/* Seule la Premier League est cochée par défaut à l'ouverture du site. */
const activeLeagues = new Set(["Premier League"]);

Object.keys(CLUBS_DATA).forEach(league => {
  const meta = LEAGUE_META[league];
  const group = L.markerClusterGroup({
    iconCreateFunction: makeClusterIcon,
    maxClusterRadius: 45,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false
  });

  CLUBS_DATA[league].forEach(club => {
    const marker = L.marker([club.lat, club.lon], { icon: crestIcon(club.name, meta.hex) });

    const query = encodeURIComponent(club.name + " " + LEAGUE_SHORT[league]);
    const flashscoreUrl = `https://www.google.com/search?q=${query}+site:flashscore.fr`;

    marker.bindPopup(() => {
      const now = new Date();
      // Filtre de sécurité côté client : même si fixtures.json contient
      // un match déjà joué (fichier pas encore réactualisé), il disparaît
      // ici dès que l'heure du coup d'envoi est passée.
      const fixtures = (FIXTURES_DATA[club.name] || []).filter(f => new Date(f.date) >= now);
      let fixturesHtml;
      if (fixtures.length){
        const months = {}; // "2026-09" -> { label: "Septembre 2026", items: [...] }
        fixtures.forEach(f => {
          const d = new Date(f.date);
          const key = d.getFullYear() + '-' + String(d.getMonth()).padStart(2, '0');
          if (!months[key]){
            const label = d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
            months[key] = { label: label.charAt(0).toUpperCase() + label.slice(1), items: [] };
          }
          months[key].items.push(f);
        });
        const monthKeys = Object.keys(months).sort();
        const optionsHtml = monthKeys.map((k, i) => `<option value="${i}">${months[k].label}</option>`).join('');
        const groupsHtml = monthKeys.map((k, i) => `
          <div class="fixture-month-group" data-month-index="${i}"${i === 0 ? '' : ' style="display:none"'}>
            ${months[k].items.map(f => `
              <div class="fixture-row">
                <div class="fixture-competition">
                  <img src="${competitionLogoPath(f.competitionSlug || slugify(f.competition))}" alt="" onerror="this.style.display='none'">
                  <span>${f.competition}</span>
                </div>
                <div class="fixture-main">
                  <span class="fixture-date">${formatFixtureDate(f.date)}</span>
                  <div class="fixture-opp">
                    <span class="fixture-vs">vs</span>
                    <img class="fixture-opp-crest" src="${crestPath(f.opponent)}" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline'">
                    <span class="fixture-opp-name" style="display:none">${f.opponent}</span>
                  </div>
                </div>
              </div>`).join('')}
          </div>`).join('');
        fixturesHtml = `
          <select class="fixture-month-select">${optionsHtml}</select>
          <div class="popup-fixtures">${groupsHtml}</div>`;
      } else {
        fixturesHtml = `
          <div class="popup-fixtures empty">Calendrier pas encore disponible pour ce club.</div>
          <a class="popup-link" href="${flashscoreUrl}" target="_blank" rel="noopener">
            Voir sur Flashscore
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 17 17 7M7 7h10v10"/></svg>
          </a>`;
      }
      return `
        <div class="popup-crest"><img src="${crestPath(club.name)}" alt="" onerror="this.parentElement.style.display='none'"></div>
        <div class="popup-league" style="color:${meta.hex}">${meta.country} · ${LEAGUE_SHORT[league]}</div>
        <div class="popup-name">${club.name}</div>
        <div class="popup-subheading">Matchs à domicile</div>
        ${fixturesHtml}
      `;
    });

    marker.on('popupopen', () => {
      const popupEl = marker.getPopup().getElement();
      if (!popupEl) return;
      const crestWrap = popupEl.querySelector('.popup-crest');
      if (crestWrap) crestWrap.style.display = 'flex';
      const select = popupEl.querySelector('.fixture-month-select');
      if (select){
        select.addEventListener('change', () => {
          popupEl.querySelectorAll('.fixture-month-group').forEach(g => {
            g.style.display = (g.dataset.monthIndex === select.value) ? '' : 'none';
          });
        });
      }
    });

    group.addLayer(marker);
    allMarkers.push({ marker, league, name: club.name, lat: club.lat, lon: club.lon });
  });

  clusterGroups[league] = group;
  if (activeLeagues.has(league)) map.addLayer(group);
});

/* ---------------- SIDEBAR: LEAGUE LIST ---------------- */
const leaguesByCountry = {};
Object.keys(CLUBS_DATA).forEach(league => {
  const c = LEAGUE_META[league].country;
  if (!leaguesByCountry[c]) leaguesByCountry[c] = [];
  leaguesByCountry[c].push(league);
});

const leaguesEl = document.getElementById('leagues');

Object.keys(leaguesByCountry).forEach(country => {
  const groupDiv = document.createElement('div');
  groupDiv.className = 'country-group';
  const title = document.createElement('div');
  title.className = 'country-title';
  title.textContent = country;
  groupDiv.appendChild(title);

  leaguesByCountry[country].forEach(league => {
    const row = document.createElement('div');
    row.className = 'league-row';
    row.dataset.league = league;
    row.innerHTML = `
      <img class="league-logo" src="${competitionLogoPath(slugify(league))}" alt="" onerror="this.style.display='none'">
      <div class="lname">${LEAGUE_SHORT[league]}</div>
      <div class="lcount">${CLUBS_DATA[league].length}</div>
    `;
    if (!activeLeagues.has(league)) row.classList.add('off');
    row.addEventListener('click', () => toggleLeague(league, row));
    groupDiv.appendChild(row);
  });

  leaguesEl.appendChild(groupDiv);
});

updateCount();

function toggleLeague(league, row){
  if (activeLeagues.has(league)){
    activeLeagues.delete(league);
    map.removeLayer(clusterGroups[league]);
    row.classList.add('off');
  } else {
    activeLeagues.add(league);
    map.addLayer(clusterGroups[league]);
    row.classList.remove('off');
  }
  updateCount();
}

document.getElementById('btn-all').addEventListener('click', () => {
  document.querySelectorAll('.league-row').forEach(row => {
    const league = row.dataset.league;
    if (!activeLeagues.has(league)){
      activeLeagues.add(league);
      map.addLayer(clusterGroups[league]);
      row.classList.remove('off');
    }
  });
  updateCount();
});

document.getElementById('btn-none').addEventListener('click', () => {
  document.querySelectorAll('.league-row').forEach(row => {
    const league = row.dataset.league;
    if (activeLeagues.has(league)){
      activeLeagues.delete(league);
      map.removeLayer(clusterGroups[league]);
      row.classList.add('off');
    }
  });
  updateCount();
});

function updateCount(){
  let total = 0;
  activeLeagues.forEach(l => total += CLUBS_DATA[l].length);
  document.getElementById('visible-count').textContent = total + " clubs";
  document.getElementById('badge-count').textContent = total;
}

/* ---------------- SEARCH ---------------- */
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (q.length < 2){
    searchResults.classList.remove('show');
    searchResults.innerHTML = '';
    return;
  }
  const matches = allMarkers.filter(m => m.name.toLowerCase().includes(q)).slice(0, 12);
  if (matches.length === 0){
    searchResults.innerHTML = '<div class="search-result" style="opacity:.6;cursor:default">Aucun résultat</div>';
  } else {
    searchResults.innerHTML = matches.map(m => {
      const meta = LEAGUE_META[m.league];
      return `<div class="search-result" data-lat="${m.lat}" data-lon="${m.lon}" data-league="${m.league}" data-name="${m.name.replace(/"/g,'&quot;')}">
        <div class="dot" style="background:${meta.hex}"></div>
        <span>${m.name}</span>
        <span class="league">${LEAGUE_SHORT[m.league]}</span>
      </div>`;
    }).join('');
  }
  searchResults.classList.add('show');
});

searchResults.addEventListener('click', (e) => {
  const row = e.target.closest('.search-result');
  if (!row || !row.dataset.lat) return;
  const lat = parseFloat(row.dataset.lat);
  const lon = parseFloat(row.dataset.lon);
  const league = row.dataset.league;

  // make sure the league is active
  if (!activeLeagues.has(league)){
    activeLeagues.add(league);
    map.addLayer(clusterGroups[league]);
    document.querySelector(`.league-row[data-league="${CSS.escape(league)}"]`).classList.remove('off');
    updateCount();
  }

  map.setView([lat, lon], 12, { animate: true });
  setTimeout(() => {
    const found = allMarkers.find(m => m.name === row.dataset.name && m.league === league);
    if (found) found.marker.openPopup();
  }, 400);

  searchResults.classList.remove('show');
  searchInput.value = row.dataset.name;
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) searchResults.classList.remove('show');
});

/* ---------------- SIDEBAR TOGGLE ---------------- */
document.getElementById('toggle-sidebar').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('collapsed');
  setTimeout(() => map.invalidateSize(), 260);
});

/* Sur mobile, on démarre panneau replié pour laisser la carte visible ;
   on referme aussi automatiquement le panneau après un clic sur un club
   en recherche, pour voir le marqueur sans avoir à replier soi-même. */
if (window.matchMedia('(max-width: 720px)').matches) {
  document.getElementById('sidebar').classList.add('collapsed');
  setTimeout(() => map.invalidateSize(), 300);
}
searchResults.addEventListener('click', (e) => {
  const row = e.target.closest('.search-result');
  if (!row || !row.dataset.lat) return;
  if (window.matchMedia('(max-width: 720px)').matches) {
    document.getElementById('sidebar').classList.add('collapsed');
    setTimeout(() => map.invalidateSize(), 260);
  }
});
</script>
</body>
